services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seeandcapture-server
    ports:
      - "8787:8787"
    env_file:
      - server/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      # Inside Compose, reach rembg by service name (override in .env if needed)
      REMBG_URL: ${REMBG_URL:-http://rembg:7000}
      REMBG_MODEL: ${REMBG_MODEL:-birefnet-general}
    depends_on:
      - rembg
    networks:
      - seeandcapture
    restart: unless-stopped

  rembg:
    image: danielgatis/rembg:latest
    container_name: seeandcapture-rembg
    command: ["s", "--host", "0.0.0.0", "--port", "7000", "--no-ui"]
    ports:
      - "7000:7000"
    volumes:
      - rembg-models:/root/.u2net
    networks:
      - seeandcapture
    restart: unless-stopped

networks:
  seeandcapture:
    driver: bridge

volumes:
  rembg-models:

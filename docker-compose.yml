services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seeandcapture-server
    ports:
      - "8787:8787"
    env_file:
      - server/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
    networks:
      - seeandcapture
    restart: unless-stopped

networks:
  seeandcapture:
    driver: bridge
